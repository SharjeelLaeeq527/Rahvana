name: Hardcoded colours

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  check-colors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Node built-ins only, no npm install needed.
      - name: Hardcoded colours must not go up (dark mode ratchet)
        run: node scripts/check-hardcoded-colors.mjs
