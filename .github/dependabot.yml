version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      security-critical:
        patterns:
          - "pdfjs-dist"
          - "dompurify"
          - "jsdom"
          - "file-type"
          - "next"
    reviewers: []