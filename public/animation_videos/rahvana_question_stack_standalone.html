
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #f5f0f0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  .outer {
    background: #faf6f6;
    border-radius: 24px;
    padding: 40px 24px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    width: 400px;
    height: 600px;
    box-shadow: 0 2px 32px rgba(160,40,40,0.07);
    position: relative;
  }

  /* ── Person side ── */
  .person-side {
    width: 100%;
    height: 180px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
  }

  .person-img-container {
    width: 120px;
    height: 180px;
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  .person-img {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity 400ms ease-in-out;
    will-change: opacity;
  }

  .person-img.active {
    opacity: 1;
  }

  /* Thought bubble that floats above the person */
  .thought-bubble {
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    background: #fff;
    border: 1.5px solid #e8dada;
    border-radius: 50px;
    padding: 8px 18px;
    font-size: 12px;
    font-style: italic;
    color: #c0392b;
    white-space: nowrap;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    opacity: 0;
    transition: opacity 600ms ease;
    pointer-events: none;
    z-index: 10;
  }
  .thought-bubble::after {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 10px;
    background: #fff;
    border-right: 1.5px solid #e8dada;
    border-bottom: 1.5px solid #e8dada;
    border-radius: 0 0 4px 0;
    transform: translateX(-50%) rotate(45deg);
    bottom: -6px;
  }

  /* ── Cards side ── */
  .stack-area {
    position: relative;
    width: 350px;
    height: 340px;
  }

  .q-card {
    position: absolute;
    left: 0;
    width: 100%;
    background: #ffffff;
    border: 0.5px solid #e8dada;
    border-radius: 12px;
    padding: 15px 20px;
    font-family: inherit;
    opacity: 0;
    will-change: transform, opacity, filter;
    box-shadow: 0 1px 8px rgba(0,0,0,0.05);
  }

  .q-card .q-label {
    font-size: 10px;
    font-weight: 600;
    color: #b0a0a0;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .q-card .q-text {
    font-size: 14px;
    color: #2c1f1f;
    font-weight: 400;
  }

  .header-card {
    position: absolute;
    left: 0;
    width: 100%;
    background: #ffffff;
    border: 0.5px solid #e8dada;
    border-radius: 12px;
    padding: 15px 20px;
    font-family: inherit;
    opacity: 0;
    will-change: transform, opacity;
    box-shadow: 0 1px 8px rgba(0,0,0,0.05);
  }

  .header-card .h-eyebrow {
    font-size: 10px;
    font-weight: 600;
    color: #c0392b;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .header-card .h-title {
    font-size: 15px;
    font-weight: 500;
    color: #2c1f1f;
  }

  .fear-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
  }

  .fear-text {
    font-size: 15px;
    font-weight: 500;
    color: #c0392b;
    text-align: center;
    line-height: 1.7;
    font-family: inherit;
    max-width: 240px;
  }
</style>
</head>
<body>
<div class="outer" id="outerWrap">
  <div class="stack-area" id="stackArea">

    <div class="header-card" id="headerCard">
      <div class="h-eyebrow">Visa interview</div>
      <div class="h-title">Interview questions</div>
    </div>

    <div class="q-card" id="qc0"><div class="q-label">Question 1</div><div class="q-text">When did you meet?</div></div>
    <div class="q-card" id="qc1"><div class="q-label">Question 2</div><div class="q-text">When was your wedding?</div></div>
    <div class="q-card" id="qc2"><div class="q-label">Question 3</div><div class="q-text">Where does your spouse work?</div></div>
    <div class="q-card" id="qc3"><div class="q-label">Question 4</div><div class="q-text">When did they last visit?</div></div>
    <div class="q-card" id="qc4"><div class="q-label">Question 5</div><div class="q-text">Who attended the wedding?</div></div>

    <div class="fear-overlay" id="fearOverlay">
      <div class="fear-text">What if I get nervous<br>and fumble?</div>
    </div>

  </div>

  <!-- Person illustration with posture poses -->
  <div class="person-side">
    <div class="thought-bubble" id="thoughtBubble">Will I stay confident under pressure?</div>
    <div class="person-img-container">
      <img id="pose1" class="person-img active" src="/assets/images/pose_1.png" alt="Person Pose 1" />
      <img id="pose2" class="person-img" src="/assets/images/pose_2.png" alt="Person Pose 2" />
    </div>
  </div>
</div>

<script>
(function() {
  const CARD_H = 72;
  const GAP = 10;
  const BASE_Y = 260;
  const questions = ['qc0','qc1','qc2','qc3','qc4'];

  function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

  function setPose(poseNum) {
    const poses = [1, 2];
    poses.forEach(num => {
      const el = document.getElementById(`pose${num}`);
      if (el) {
        if (num === poseNum) {
          el.classList.add('active');
        } else {
          el.classList.remove('active');
        }
      }
    });
  }

  function initAll() {
    const header = document.getElementById('headerCard');
    header.style.transition = 'none';
    header.style.opacity = '0';
    header.style.transform = `translateY(${BASE_Y + 24}px)`;

    questions.forEach(id => {
      const el = document.getElementById(id);
      el.style.transition = 'none';
      el.style.opacity = '0';
      el.style.filter = 'none';
      el.style.transform = `translateY(${BASE_Y + 32}px)`;
    });

    const tb = document.getElementById('thoughtBubble');
    tb.style.transition = 'none';
    tb.style.opacity = '0';

    const fo = document.getElementById('fearOverlay');
    fo.style.transition = 'none';
    fo.style.opacity = '0';

    setPose(1);
  }

  function stackY(totalVisible, cardIndex) {
    return BASE_Y - (totalVisible - 1 - cardIndex) * (CARD_H + GAP);
  }

  async function runLoop() {
    initAll();
    await wait(300);

    const header = document.getElementById('headerCard');
    void header.offsetWidth;
    header.style.transition = 'opacity 700ms ease, transform 700ms cubic-bezier(.22,.68,0,1.1)';
    header.style.opacity = '1';
    header.style.transform = `translateY(${BASE_Y}px)`;
    await wait(1800);

    for (let i = 0; i < questions.length; i++) {
      const id = questions[i];
      const el = document.getElementById(id);
      const ty = stackY(i + 1, i);

      el.style.transition = 'none';
      el.style.opacity = '0';
      el.style.transform = `translateY(${ty + 30}px)`;
      el.style.filter = 'none';
      void el.offsetWidth;

      el.style.transition = 'opacity 600ms ease, transform 600ms cubic-bezier(.22,.68,0,1.1)';
      el.style.opacity = '1';
      el.style.transform = `translateY(${ty}px)`;

      for (let j = 0; j < i; j++) {
        const prev = document.getElementById(questions[j]);
        const depth = i - j;
        prev.style.transition = 'opacity 600ms ease, transform 600ms cubic-bezier(.22,.68,0,1.1), filter 600ms ease';
        prev.style.transform = `translateY(${stackY(i + 1, j)}px)`;
        prev.style.opacity = String(Math.max(1 - depth * 0.18, 0.3));
        prev.style.filter = `blur(${Math.min(depth * 0.7, 2.5)}px)`;
      }

      await wait(i === questions.length - 1 ? 900 : 1100);
    }

    const tb = document.getElementById('thoughtBubble');
    tb.style.transition = 'opacity 800ms ease';
    tb.style.opacity = '1';
    setPose(2);

    await wait(600);
    questions.forEach((id, i) => {
      const el = document.getElementById(id);
      const y = stackY(questions.length, i);
      el.style.transition = 'transform 150ms ease';
      el.style.transform = `translateY(${y - 3}px)`;
      setTimeout(() => {
        el.style.transition = 'transform 280ms ease';
        el.style.transform = `translateY(${y + 2}px)`;
        setTimeout(() => {
          el.style.transition = 'transform 280ms ease';
          el.style.transform = `translateY(${y}px)`;
        }, 280);
      }, 150);
    });

    await wait(2200);

    const fadeEls = [
      ...questions.map(id => document.getElementById(id)), 
      document.getElementById('headerCard'), 
      tb
    ];
    fadeEls.forEach(el => {
      if (!el) return;
      el.style.transition = 'opacity 800ms ease';
      el.style.opacity = '0';
    });

    await wait(600);

    const fo = document.getElementById('fearOverlay');
    fo.style.transition = 'opacity 900ms ease';
    fo.style.opacity = '1';

    await wait(2400);

    fo.style.transition = 'opacity 700ms ease';
    fo.style.opacity = '0';

    await wait(800);
    runLoop();
  }

  runLoop();
})();
</script>
</body>
</html>
