<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  .outer {
    font-family:
      -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
      sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 0 24px;
    min-height: 440px;
    background: transparent;
  }
  .progress-dots {
    display: flex;
    gap: 7px;
    margin-bottom: 18px;
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ccc;
    transition: background 0.4s;
  }
  .dot.active {
    background: #555;
  }
  .scene-label {
    font-size: 13px;
    color: #888;
    letter-spacing: 0.03em;
    margin-bottom: 22px;
    min-height: 20px;
    text-align: center;
  }
  .doc-stack {
    position: relative;
    width: 210px;
    height: 250px;
  }
  .doc {
    position: absolute;
    width: 158px;
    height: 200px;
    background: #ffffff;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 16px 14px 12px;
    opacity: 0;
    display: flex;
    flex-direction: column;
  }
  .doc-icon {
    width: 26px;
    height: 26px;
    margin-bottom: 9px;
    color: #888;
    flex-shrink: 0;
  }
  .doc-icon svg {
    width: 26px;
    height: 26px;
    stroke: #888;
    fill: none;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .doc-title {
    font-size: 12px;
    font-weight: 600;
    color: #2a2a2a;
    line-height: 1.4;
  }
  .doc-lines {
    margin-top: 11px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .doc-line {
    height: 2px;
    border-radius: 1px;
    background: #ebebeb;
  }
  .doc-label {
    position: absolute;
    right: -10px;
    top: 14px;
    font-size: 10px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 3px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
  }
  .label-q {
    background: #faeeda;
    color: #854f0b;
    border: 1px solid #e8c070;
  }
  .label-warn {
    background: #fde8e8;
    color: #a32d2d;
    border: 1px solid #f0a0a0;
  }
  .warn-banner {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 500;
    color: #a32d2d;
    background: #fde8e8;
    border: 1px solid #f0a0a0;
    border-radius: 5px;
    padding: 9px 16px;
    margin-top: 18px;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  .warn-banner svg {
    width: 15px;
    height: 15px;
    stroke: #a32d2d;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
  }
  .warn-banner.visible {
    opacity: 1;
  }
  @keyframes slideIn {
    from {
      opacity: 0;
      transform: translateY(-48px) rotate(var(--tilt));
    }
    to {
      opacity: 1;
      transform: translateY(0) rotate(var(--tilt));
    }
  }
  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(5px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  @keyframes warnPulse {
    0%,
    100% {
      opacity: 1;
    }
    50% {
      opacity: 0.35;
    }
  }
</style>

<div class="outer">
  <div class="progress-dots">
    <div class="dot active" id="d0"></div>
    <div class="dot" id="d1"></div>
    <div class="dot" id="d2"></div>
  </div>
  <div class="scene-label" id="scene-label">Documents arriving...</div>
  <div class="doc-stack" id="stack"></div>
  <div class="warn-banner" id="warn-banner">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
      />
      <line x1="12" y1="9" x2="12" y2="13" />
      <line x1="12" y1="17" x2="12.01" y2="17" />
    </svg>
    This document may delay your application
  </div>
</div>

<script>
  const ICONS = {
    heart: `<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`,
    passport: `<svg viewBox="0 0 24 24"><rect x="3" y="2" width="18" height="20" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M6 20v-1a6 6 0 0 1 12 0v1"/></svg>`,
    cert: `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="12" y2="17"/></svg>`,
    receipt: `<svg viewBox="0 0 24 24"><path d="M4 2v20l3-2 2 2 2-2 2 2 2-2 3 2V2l-3 2-2-2-2 2-2-2-2 2z"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/></svg>`,
    camera: `<svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>`,
    shield: `<svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`,
  };

  const docs = [
    {
      title: "Marriage Certificate",
      icon: "heart",
      tilt: -2,
      left: 14,
      top: 22,
    },
    { title: "Passport", icon: "passport", tilt: 1.5, left: 18, top: 17 },
    { title: "Birth Certificate", icon: "cert", tilt: -1, left: 11, top: 13 },
    { title: "Tax Return", icon: "receipt", tilt: 2, left: 18, top: 9 },
    { title: "Photos", icon: "camera", tilt: -1.5, left: 14, top: 5 },
    { title: "Police Certificate", icon: "shield", tilt: 1, left: 12, top: 1 },
  ];

  const qLabels = [
    "? Required?",
    "? Maybe?",
    "? Need original?",
    "? Apostille needed?",
    "? Need translation?",
    "? Valid copy?",
  ];

  const DOC_INTERVAL = 950;
  const SCENE1_HOLD = 1300;
  const LABEL_INTERVAL = 850;
  const SCENE2_HOLD = 1500;
  const SLIDE_DUR = 1000;
  const WARN_HOLD = 3500;
  const LOOP_PAUSE = 900;

  let docEls = [],
    labelEls = [];
  const stackEl = document.getElementById("stack");
  const sceneEl = document.getElementById("scene-label");
  const warnEl = document.getElementById("warn-banner");

  function setDot(n) {
    [0, 1, 2].forEach((i) =>
      document.getElementById("d" + i).classList.toggle("active", i === n),
    );
  }

  function buildDocs() {
    stackEl.innerHTML = "";
    docEls = [];
    labelEls = [];
    docs.forEach((d, i) => {
      const el = document.createElement("div");
      el.className = "doc";
      el.style.cssText = `--tilt:${d.tilt}deg; z-index:${i + 1}; left:${d.left}px; top:${d.top}px; transform:rotate(${d.tilt}deg);`;
      el.innerHTML = `
      <div class="doc-icon">${ICONS[d.icon]}</div>
      <div class="doc-title">${d.title}</div>
      <div class="doc-lines">
        <div class="doc-line" style="width:76%"></div>
        <div class="doc-line" style="width:56%"></div>
        <div class="doc-line" style="width:66%"></div>
        <div class="doc-line" style="width:44%"></div>
      </div>`;
      const lbl = document.createElement("div");
      lbl.className = "doc-label label-q";
      lbl.textContent = qLabels[i];
      el.appendChild(lbl);
      labelEls.push(lbl);
      stackEl.appendChild(el);
      docEls.push(el);
    });
  }

  function scene1(done) {
    setDot(0);
    sceneEl.textContent = "Documents arriving...";
    warnEl.classList.remove("visible");
    warnEl.style.animation = "none";
    labelEls.forEach((l) => {
      l.style.opacity = "0";
      l.style.animation = "none";
    });
    docEls.forEach((el, i) => {
      el.style.transition = "none";
      el.style.opacity = "0";
      el.style.transform = `rotate(${docs[i].tilt}deg) translateX(0)`;
    });
    docs.forEach((d, i) => {
      setTimeout(() => {
        docEls[i].style.animation =
          "slideIn 0.6s cubic-bezier(0.22,0.9,0.36,1) forwards";
      }, i * DOC_INTERVAL);
    });
    setTimeout(done, docs.length * DOC_INTERVAL + SCENE1_HOLD);
  }

  function scene2(done) {
    setDot(1);
    sceneEl.textContent = "Which ones are actually needed?";
    labelEls.forEach((lbl, i) => {
      setTimeout(() => {
        lbl.style.animation = "fadeUp 0.45s ease forwards";
      }, i * LABEL_INTERVAL);
    });
    setTimeout(done, labelEls.length * LABEL_INTERVAL + SCENE2_HOLD);
  }

  function scene3(done) {
    setDot(2);
    sceneEl.textContent = "Everything pauses...";
    const topDoc = docEls[5];
    const topLbl = labelEls[5];
    topLbl.className = "doc-label label-warn";
    topLbl.textContent = "! Missing?";
    topDoc.style.transition = `transform ${SLIDE_DUR}ms cubic-bezier(0.4,0,0.2,1)`;
    topDoc.style.transform = `translateX(58px) rotate(11deg)`;
    setTimeout(() => {
      warnEl.classList.add("visible");
      warnEl.style.animation = "warnPulse 1.8s ease-in-out infinite";
    }, SLIDE_DUR + 400);
    setTimeout(done, SLIDE_DUR + 400 + WARN_HOLD);
  }

  function runLoop() {
    buildDocs();
    scene1(() => scene2(() => scene3(() => setTimeout(runLoop, LOOP_PAUSE))));
  }

  runLoop();
</script>
