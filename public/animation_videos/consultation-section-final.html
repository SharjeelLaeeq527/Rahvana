<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Consultation — Swipe to Answer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #152925;
    --teal: #1B6B57;
    --teal-deep: #0F3D33;
    --clay: #C1794C;
    --sub: #5C6D67;
    --line: rgba(21,41,37,0.10);
    --cream: #F5F8F3;
    --cream-deep: #EAF1E8;
    --card: rgba(255,255,255,0.72);
    --card-border: rgba(255,255,255,0.9);
    --fill-tint: rgba(27,107,87,0.15);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--ink);
    background: #fff;
  }

  .consult {
    position: relative;
    overflow: hidden;
    padding: 6rem 1.5rem;
    background: linear-gradient(160deg, var(--cream) 0%, var(--cream-deep) 100%);
  }

  @media (min-width: 640px) { .consult { padding: 6rem 2.5rem; } }
  @media (min-width: 1024px) { .consult { padding: 6rem 4rem; } }

  .wrap {
    max-width: 72rem;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr;
    gap: 4rem;
    align-items: center;
  }

  @media (min-width: 1024px) {
    .wrap { grid-template-columns: 1fr 1fr; gap: 3rem; }
  }

  /* ---------------- Left column ---------------- */

  .col-left { order: 2; }
  .col-right { order: 1; display: flex; justify-content: center; }

  @media (min-width: 1024px) {
    .col-left { order: 1; }
    .col-right { order: 2; justify-content: flex-end; }
  }

  .left-inner {
    opacity: 0;
    transform: translateY(10px);
    animation: riseIn 0.6s ease-out forwards;
  }

  @keyframes riseIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.6);
    color: var(--teal-deep);
    padding: 0.3rem 0.85rem;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .badge .dot {
    width: 6px;
    height: 6px;
    border-radius: 999px;
    background: var(--teal);
    display: inline-block;
  }

  h2 {
    margin: 1.5rem 0 0;
    font-size: 2.5rem;
    line-height: 1.1;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  @media (min-width: 640px) { h2 { font-size: 3rem; } }

  h2 .accent { color: var(--teal); }

  .lede {
    margin: 1.25rem 0 0;
    max-width: 30rem;
    font-size: 1rem;
    line-height: 1.6;
    color: var(--sub);
  }

  .trust {
    margin-top: 2.5rem;
    display: flex;
    flex-wrap: wrap;
    row-gap: 0.75rem;
    column-gap: 2rem;
  }

  .trust-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.875rem;
    color: var(--sub);
  }

  .trust-item svg { flex-shrink: 0; color: var(--teal); }

  /* ---------------- Right column: card ---------------- */

  .card-wrap {
    position: relative;
    width: 100%;
    max-width: 24rem;
    opacity: 0;
    animation: cardIn 0.35s ease-out forwards;
  }

  @keyframes cardIn {
    to { opacity: 1; }
  }

  /* the message panel slides in on top of the already-present frame,
     matching the sketch's "0.6s — slides in" beat */
  .message-panel {
    opacity: 0;
    animation: panelIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: 0.5s;
  }

  @keyframes panelIn {
    from { opacity: 0; transform: translateX(40px) rotate(3deg); filter: blur(4px); }
    to   { opacity: 1; transform: translateX(0) rotate(0deg); filter: blur(0px); }
  }

  .glow {
    position: absolute;
    inset: -1.5rem;
    border-radius: 2.5rem;
    filter: blur(28px);
    background: radial-gradient(60% 60% at 50% 30%, rgba(27,107,87,0.18), transparent);
    animation: breathe 5s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.55; }
  }

  .card {
    position: relative;
    border-radius: 1.5rem;
    border: 1px solid var(--card-border);
    background: var(--card);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    padding: 1.5rem;
    box-shadow: 0 30px 60px -25px rgba(21,41,37,0.35), 0 10px 20px -15px rgba(21,41,37,0.15);
  }

  .status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2rem;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--sub);
  }

  .status-dot-wrap { position: relative; width: 8px; height: 8px; display: inline-flex; }

  .ping {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: var(--teal);
    opacity: 0.6;
    animation: ping 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
  }

  @keyframes ping {
    75%, 100% { transform: scale(2.4); opacity: 0; }
  }

  .statusdot {
    position: relative;
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: var(--teal);
  }

  .avatar {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 2.25rem;
    height: 2.25rem;
    border-radius: 999px;
    background: var(--teal-deep);
    color: #fff;
  }

  .messages {
    min-height: 132px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0.75rem;
    margin-bottom: 2rem;
  }

  .msg {
    margin: 0;
    opacity: 0;
    animation: fadeIn 0.6s ease-out forwards;
  }

  .msg1 { font-size: 1.5rem; font-weight: 600; color: var(--ink); animation-delay: 1.2s; }
  .msg2 { font-size: 1.125rem; font-weight: 500; color: var(--sub); animation-delay: 1.8s; }
  .msg3 { font-size: 1.125rem; font-weight: 500; color: var(--sub); animation-delay: 2.4s; }

  @keyframes fadeIn { to { opacity: 1; } }

  .status-line {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--ink);
    opacity: 0;
    animation: fadeIn 0.4s ease-out forwards;
  }

  /* ---------------- Swipe rail ---------------- */

  .rail {
    position: relative;
    height: 3.5rem;
    width: 100%;
    border-radius: 999px;
    overflow: hidden;
    background: var(--cream-deep);
    touch-action: none;
  }

  .fill {
    position: absolute;
    top: 0; bottom: 0; left: 0;
    width: 38px; /* handle radius + padding, JS keeps this in sync */
    border-radius: 999px;
    background: var(--fill-tint);
    transition: width 0.05s linear;
  }

  .hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.875rem;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--sub);
    pointer-events: none;
    transition: opacity 0.15s linear;
  }

  .handle {
    position: absolute;
    left: 6px;
    top: 6px;
    width: 44px;
    height: 44px;
    border-radius: 999px;
    background: var(--teal-deep);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    transform: translateX(0px) scaleX(1);
    transform-origin: left center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.18);
  }

  .handle:active { cursor: grabbing; }

  .handle.snapping {
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .handle.nudging {
    animation: nudge 1s ease-in-out;
  }

  @keyframes nudge {
    0%, 100% { transform: translateX(0px) scaleX(1); }
    50% { transform: translateX(10px) scaleX(1); }
  }

  .handle:focus-visible {
    outline: 2px solid var(--teal);
    outline-offset: 2px;
  }

  .handle.busy { pointer-events: none; opacity: 0.7; }

  .pulse-ring {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: var(--teal);
    opacity: 0;
    pointer-events: none;
    animation: pulseRing 2.2s cubic-bezier(0, 0, 0.2, 1) infinite;
    animation-play-state: paused;
  }

  .handle.pulsing .pulse-ring { animation-play-state: running; }
  .pulse-ring:nth-of-type(2) { animation-delay: 1.1s; }

  @keyframes pulseRing {
    0%   { transform: scale(1);   opacity: 0.45; }
    70%  { opacity: 0; }
    100% { transform: scale(2.4); opacity: 0; }
  }

  /* ---------------- Reduced motion ---------------- */

  @media (prefers-reduced-motion: reduce) {
    .left-inner { animation: none; opacity: 1; transform: none; }
    .card-wrap { animation: none; opacity: 1; }
    .message-panel { animation: none; opacity: 1; transform: none; filter: none; }
    .glow { animation: none; opacity: 0.4; }
    .msg { animation: none; opacity: 1; }
    .status-line { animation: none; opacity: 1; }
    .ping { animation: none; display: none; }
    .handle.nudging { animation: none; }
    .handle.snapping { transition: transform 0.2s linear; }
  }
</style>
</head>
<body>

<section class="consult">
  <div class="wrap">

    <!-- Left column -->
    <div class="col-left">
      <div class="left-inner">
        <span class="badge">
          <span class="dot"></span>
          ONE-ON-ONE GUIDANCE
        </span>

        <h2>
          Sometimes, a conversation is the next step.
        </h2>

        <p class="lede">
          When the roadmap feels overwhelming, one conversation can bring clarity and confidence.
        </p>

        <div class="trust">
          <div class="trust-item">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            30-minute sessions
          </div>
          <div class="trust-item">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.5 3.8 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
            Private &amp; confidential
          </div>
          <!-- <div class="trust-item">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            No sales pitch
          </div> -->
        </div>
      </div>
    </div>

    <!-- Right column -->
    <div class="col-right">
      <div class="card-wrap">
        <div class="glow" aria-hidden="true"></div>

        <div class="card">
          <div class="status-row">
            <span class="status">
              <span class="status-dot-wrap">
                <span class="ping"></span>
                <span class="statusdot"></span>
              </span>
              Consultation request
            </span>
            <span class="avatar">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            </span>
          </div>

          <div class="messages" id="messages">
            <div class="message-panel">
              <p class="msg msg1">30 minutes.</p>
              <p class="msg msg2">All your questions.</p>
              <!-- <p class="msg msg3">Private &amp; confidential.</p> -->
            </div>
          </div>

          <div class="rail" id="rail">
            <div class="fill" id="fill"></div>
            <span class="hint" id="hint">Slide to book</span>
            <div
              class="handle"
              id="handle"
              tabindex="0"
              role="slider"
              aria-valuemin="0"
              aria-valuemax="1"
              aria-valuenow="0"
              aria-label="Slide to answer the consultation call, or press Enter"
            >
              <span class="pulse-ring" aria-hidden="true"></span>
              <span class="pulse-ring" aria-hidden="true"></span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</section>

<script>
(function () {
  var rail = document.getElementById('rail');
  var handle = document.getElementById('handle');
  var fill = document.getElementById('fill');
  var hint = document.getElementById('hint');
  var messagesEl = document.getElementById('messages');

  var HANDLE_SIZE = 44;
  var PAD = 6;
  var maxX = 0;
  var currentX = 0;
  var phase = 'idle'; // idle | dragging | connecting | opening | answered
  var dragStartClientX = 0;
  var dragStartX = 0;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var nudgeTimer = null;
  var originalMessagesHTML = messagesEl.innerHTML;

  function measure() {
    maxX = Math.max(rail.offsetWidth - HANDLE_SIZE - PAD * 2, 0);
  }
  measure();
  window.addEventListener('resize', measure);

  function setHandleX(px, opts) {
    opts = opts || {};
    currentX = Math.max(0, Math.min(maxX, px));
    var stretch = maxX > 0 ? 1 + (currentX / maxX) * 0.16 : 1;
    handle.style.transform = 'translateX(' + currentX + 'px) scaleX(' + (reduceMotion ? 1 : stretch) + ')';
    fill.style.width = (currentX + HANDLE_SIZE / 2 + PAD) + 'px';
    var hintOpacity = maxX > 0 ? Math.max(0, 1 - currentX / (maxX * 0.4)) : 1;
    hint.style.opacity = opts.hideHint ? 0 : hintOpacity;
    handle.setAttribute('aria-valuenow', maxX > 0 ? (currentX / maxX).toFixed(2) : 0);
  }

  function startNudgeLoop() {
    stopNudgeLoop();
    if (reduceMotion) return;
    nudgeTimer = setInterval(function () {
      if (phase !== 'idle') return;
      handle.classList.add('nudging');
      setTimeout(function () { handle.classList.remove('nudging'); }, 1000);
    }, 2800);
  }

  function stopNudgeLoop() {
    if (nudgeTimer) { clearInterval(nudgeTimer); nudgeTimer = null; }
  }

  function onPointerDown(e) {
    if (phase === 'connecting' || phase === 'opening') return;
    phase = 'dragging';
    stopNudgeLoop();
    handle.classList.remove('snapping', 'nudging', 'pulsing');
    handle.setPointerCapture(e.pointerId);
    dragStartClientX = e.clientX;
    dragStartX = currentX;
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
  }

  function onPointerMove(e) {
    var delta = e.clientX - dragStartClientX;
    setHandleX(dragStartX + delta);
  }

  function onPointerUp() {
    window.removeEventListener('pointermove', onPointerMove);
    window.removeEventListener('pointerup', onPointerUp);

    handle.classList.add('snapping');
    if (maxX > 0 && currentX > maxX * 0.7) {
      setHandleX(maxX, { hideHint: true });
      runCompletion();
    } else {
      setHandleX(0);
      phase = 'idle';
      startNudgeLoop();
      handle.classList.add('pulsing');
    }
  }

  function onKeyDown(e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault();
    if (phase === 'connecting' || phase === 'opening') return;
    stopNudgeLoop();
    handle.classList.remove('pulsing');
    handle.classList.add('snapping');
    setHandleX(maxX, { hideHint: true });
    runCompletion();
  }

  function showStatusLine(text) {
    messagesEl.innerHTML = '<p class="status-line">' + text + '</p>';
  }

  function runCompletion() {
    phase = 'connecting';
    handle.classList.add('busy');
    handle.classList.remove('pulsing');
    showStatusLine('Connecting&hellip;');

    setTimeout(function () {
      phase = 'opening';
      showStatusLine('Opening consultation booking&hellip;');
    }, 900);

    setTimeout(function () {
      phase = 'answered';
      // In production, trigger real navigation here instead of resetting, e.g.:
      // window.location.href = '/book-a-consultation';
    }, 2100);

    // Demo affordance so the interaction can be replayed in a static preview.
    setTimeout(function () {
      handle.classList.remove('busy');
      messagesEl.innerHTML = originalMessagesHTML;
      setHandleX(0);
      phase = 'idle';
      startNudgeLoop();
      handle.classList.add('pulsing');
    }, 4200);
  }

  handle.addEventListener('pointerdown', onPointerDown);
  handle.addEventListener('keydown', onKeyDown);

  measure();
  setHandleX(0);
  startNudgeLoop();
  if (!reduceMotion) handle.classList.add('pulsing');
})();
</script>

</body>
</html>
